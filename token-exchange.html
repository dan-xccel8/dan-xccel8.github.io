<!DOCTYPE html>
<html>
<head><title>Zoho Token Exchange</title></head>
<body style="font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px;">
<h2>Zoho Desk Token Exchange</h2>
<p>Click the button below to exchange your grant code for tokens.</p>
<button id="go" style="padding: 12px 24px; font-size: 16px; cursor: pointer;">Get Tokens</button>
<pre id="out" style="background: #f5f5f5; padding: 15px; margin-top: 20px; white-space: pre-wrap; word-break: break-all;"></pre>
<script>
document.getElementById('go').onclick = async () => {
  const out = document.getElementById('out');
  out.textContent = 'Exchanging...';
  const params = new URLSearchParams({
    grant_type: 'authorization_code',
    client_id: '1000.FOYADEBOGFY1PKFY1UFCSIXRGLK8TU',
    client_secret: 'e3b94912e31fb9e2c1c6cbec89a7073cdbe2e702b4',
    code: '1000.8d56054c24779a0edaa02c58fb0e7b9b.cf6fc640548e78ac74be622261e508c7'
  });
  try {
    const res = await fetch('https://accounts.zoho.com/oauth/v2/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params.toString()
    });
    const data = await res.json();
    out.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    out.textContent = 'Error: ' + e.message;
  }
};
</script>
</body>
</html>
